version: "3.9"
name: wcp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wcp
      POSTGRES_USER: wcp
      POSTGRES_PASSWORD: wcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcp"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  coordinator:
    image: python:3.13-slim
    working_dir: /app
    command: bash -lc "pip install --quiet --upgrade pip && pip install --quiet 'fastapi' 'uvicorn' 'sqlalchemy>=2.0' 'cryptography' 'wcp-sdk' 'psycopg[binary]' && python -m uvicorn wcp_dev_runtime.coordinator_dev_app:app --host 0.0.0.0 --port 8000"
    environment:
      WCP_DATABASE_URL: postgresql+psycopg://wcp:wcp@postgres:5432/wcp
      WCP_REDIS_URL: redis://redis:6379/0
      WCP_HTTP_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/wcp/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  inspector:
    image: python:3.13-slim
    working_dir: /app
    command: bash -lc "pip install --quiet --upgrade pip && pip install --quiet fastapi uvicorn httpx && python -m inspector.serve --port 8765 --coordinator ws://coordinator:8000/wcp/ws"
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "8765:8765"

volumes:
  postgres-data:
