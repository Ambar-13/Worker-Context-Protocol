global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: hosted-test-coordinator

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:8000"]
    metrics_path: /metrics

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
    metrics_path: /metrics

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
    # postgres-exporter sidecar is operator-side; ignored when absent

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
    # ditto
