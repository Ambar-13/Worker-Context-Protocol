version: "3.9"

# WCP hosted-test-coordinator deployment.
#
# This compose file is intentionally explicit: every image is pinned by
# tag, every service has a healthcheck, and secrets come from env vars
# never from the file itself.

services:

  traefik:
    image: traefik:v3.0
    container_name: wcp-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--metrics.prometheus=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - wcp

  postgres:
    image: postgres:16-alpine
    container_name: wcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wcp

  redis:
    image: redis:7-alpine
    container_name: wcp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wcp

  coordinator:
    image: ghcr.io/wcp-project/coordinator:v1.0-rc4
    container_name: wcp-coordinator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WCP_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WCP_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WCP_COORDINATOR_DID: ${COORDINATOR_DID}
      WCP_COORDINATOR_KEY_FILE: /run/secrets/coordinator.ed25519
      WCP_PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      WCP_ENV: test
      WCP_ESCROW_PROVIDER: sandbox-noop
      WCP_LOG_LEVEL: info
    volumes:
      - ./config/coordinator.toml:/etc/wcp/coordinator.toml:ro
      - ./secrets/coordinator.ed25519:/run/secrets/coordinator.ed25519:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wcp.rule=Host(`${PUBLIC_HOSTNAME}`)"
      - "traefik.http.routers.wcp.entrypoints=websecure"
      - "traefik.http.routers.wcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.wcp.loadbalancer.server.port=8000"
    networks:
      - wcp

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: wcp-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - wcp

  grafana:
    image: grafana/grafana:11.3.0
    container_name: wcp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOSTNAME}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${PUBLIC_HOSTNAME}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - wcp

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  traefik-acme:

networks:
  wcp:
    name: wcp
