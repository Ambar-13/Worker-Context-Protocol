version: "3.9"
name: {{NAME}}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wcp
      POSTGRES_USER: wcp
      POSTGRES_PASSWORD: wcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcp"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  coordinator:
    image: python:3.13-slim
    working_dir: /app
    command: bash -lc "pip install --quiet wcp-coordinator==0.1.* && python -m wcp_dev_runtime.coordinator_dev_app"
    environment:
      WCP_POSTGRES_URL: postgresql+psycopg://wcp:wcp@postgres:5432/wcp
      WCP_REDIS_URL: redis://redis:6379/0
      WCP_HTTP_PORT: "{{PORT}}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "{{PORT}}:{{PORT}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:{{PORT}}/wcp/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
