[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcp"
version = "1.0.0rc2"
description = "Worker Context Protocol CLI: scaffold, run, test, inspect WCP workers, agents, and coordinators"
authors = [{name = "Worker Context Protocol contributors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "wcp-sdk >= 1.0.0rc1",
  "click >= 8.1",
  "rich >= 13.7",
  "httpx >= 0.27",
  "websockets >= 11",
]
keywords = ["wcp", "worker-context-protocol", "cli", "scaffolding"]

[project.optional-dependencies]
test = ["pytest >= 8.0", "pytest-asyncio >= 0.23"]

[project.scripts]
wcp = "wcp_cli.main:main"

[tool.setuptools.packages.find]
include = ["wcp_cli*"]

[tool.setuptools.package-data]
"wcp_cli" = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
