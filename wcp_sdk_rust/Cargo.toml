[package]
name = "wcp-sdk"
version = "0.95.0"
edition = "2021"
license = "Apache-2.0"
description = "Worker Context Protocol (WCP) SDK for Rust. Vendor-neutral; for embedded workers (drones, AMRs, sensor nodes, industrial controllers) and cloud coordinator integrators."
repository = "https://github.com/Ambar-13/Worker-Context-Protocol"
keywords = ["wcp", "robotics", "marketplace", "agent"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
url = "2"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1.36", features = ["macros", "rt"] }

[features]
default = []
# `no_std` target for descriptor types only (no networking).
no_std_types = []
