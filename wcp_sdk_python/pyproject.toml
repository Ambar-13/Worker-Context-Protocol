[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcp-sdk"
version = "1.0.0rc1"
description = "Worker Context Protocol (WCP) v1.0-rc1 Python SDK"
authors = [{name = "Worker Context Protocol contributors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "websockets>=11.0",
  "httpx>=0.27",
]
keywords = ["wcp", "worker-context-protocol", "marketplace", "robotics"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.98",
]

[tool.setuptools.packages.find]
include = ["wcp_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["wcp_sdk"]
ignore_missing_imports = true
